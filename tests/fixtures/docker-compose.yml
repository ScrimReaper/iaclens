version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    networks:
      - backend

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://myuser:secret@db:5432/mydb
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend

volumes:
  db_data:
  uploads:

networks:
  backend:
  frontend:
